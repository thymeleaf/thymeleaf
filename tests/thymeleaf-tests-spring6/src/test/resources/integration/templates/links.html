<!DOCTYPE html>
<html>
<body>
  <a id="context" th:href="@{/x}">.</a>
  <a id="page" th:href="@{x/y}">.</a>
  <a id="server" th:href="@{~/other/x}">.</a>
  <a id="absolute" th:href="@{http://example.test/a(q=${v})}">.</a>
  <a id="protocol" th:href="@{//cdn.example.test/lib.js}">.</a>
  <a id="pathvar" th:href="@{/o/{id}/d(id=${id},q=${v})}">.</a>
  <a id="pathvarescaped" th:href="@{/o/{seg}(seg=${v})}">.</a>
  <a id="anchor" th:href="@{/x#sec(p=1)}">.</a>
  <a id="dynamic" th:href="@{${url}(p=1)}">.</a>
  <a id="multi" th:href="@{/x(a=1,a=2,b=${null},c=${list})}">.</a>
  <img id="img" th:src="@{/img/marked.png}">
  <form id="form" th:action="@{/marked}" method="post"><button id="formaction" th:formaction="@{/marked/other}">b</button><button id="formactionpost" formmethod="post" th:formaction="@{/marked/other}">b</button><button id="formactionempty" th:formaction="${null}">b</button><button id="formactionthmethod1" th:formmethod="${'post'}" th:formaction="@{/marked/other}">b</button><button id="formactionthmethod2" th:formaction="@{/marked/other}" th:formmethod="${'post'}">b</button></form>
  <p id="inlined">[[@{/marked(p=${v})}]]</p>
  <p id="text" th:text="@{/marked}">.</p>
  <script id="js" th:inline="javascript">var u = [[@{/marked(p=${v})}]];</script>
  <p id="pathsegment" th:text="${#uris.escapePathSegment('a b/c')}">.</p>
  <p id="queryparam" th:text="${#uris.escapeQueryParam('a b&c=d')}">.</p>
</body>
</html>
