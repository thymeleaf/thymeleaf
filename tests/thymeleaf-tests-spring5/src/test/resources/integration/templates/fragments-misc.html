<!DOCTYPE html>
<html>
<body>

<section id="s3" th:insert="~{common/header :: .byclass}"></section>
<section id="s4" th:insert="~{:: local}"></section>

<section id="s11" th:insert="${!cond} ? ~{common/header :: plain} : _"><p>kept</p></section>
<section id="s12" th:insert="~{common/header :: header(title=${name})}"></section>
